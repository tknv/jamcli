name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CMake
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config ffmpeg jami-daemon

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Create DEB package
        run: cpack --config build/CPackConfig.cmake -G DEB

      - name: Create Arch package
        run: make arch

      - name: Create source archives
        run: |
          mkdir -p pkg/dist
          tar czf pkg/dist/jamcli-${GITHUB_REF_NAME}.tar.gz --exclude=./.git --exclude=./build .
          7z a pkg/dist/jamcli-${GITHUB_REF_NAME}.7z .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: pkg/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
